<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crown Rush · 活动原型与需求文档</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#0B0218; color:#F3EAFF; font-family:'Noto Sans SC', system-ui, sans-serif; }
  a { color:#E8C06A; text-decoration:none; }
  #app { display:flex; height:100vh; }
  #side { width:252px; flex:none; display:flex; flex-direction:column; background:linear-gradient(180deg,#1C0640,#0D0220); border-right:1px solid rgba(232,192,106,.22); }
  #brand { padding:18px 18px 14px; border-bottom:1px solid rgba(255,255,255,.07); }
  #brand .k { color:#E8C06A; font-size:10px; font-weight:700; letter-spacing:.28em; }
  #brand .n { font-family:Anton, sans-serif; font-size:24px; line-height:1.1; margin-top:5px; letter-spacing:.02em; }
  #brand .s { color:#8E78BE; font-size:11px; margin-top:4px; }
  #nav { flex:1; overflow-y:auto; padding:12px 10px 20px; }
  .grp { color:#6A5B8C; font-size:10px; font-weight:700; letter-spacing:.2em; padding:10px 8px 6px; }
  .item { display:block; width:100%; text-align:left; cursor:pointer; border:1px solid transparent; background:transparent; color:#DED2F5; font:inherit; font-size:13px; font-weight:700; padding:10px 11px; border-radius:9px; margin-bottom:3px; }
  .item:hover { background:rgba(255,255,255,.06); }
  .item.active { background:rgba(232,192,106,.14); border-color:rgba(232,192,106,.45); color:#F5E6C0; }
  .item .d { display:block; color:#8E78BE; font-size:10.5px; font-weight:400; margin-top:3px; }
  #toc { display:none; margin:2px 0 6px; padding:6px 0 6px 8px; border-left:1px solid rgba(232,192,106,.25); }
  #toc.open { display:block; }
  .toc { display:block; width:100%; text-align:left; cursor:pointer; border:0; background:transparent; color:#A991D6; font:inherit; font-size:11.5px; padding:5px 8px; border-radius:6px; }
  .toc.sub { color:#8E78BE; font-size:11px; padding-left:18px; }
  .toc:hover { background:rgba(255,255,255,.06); color:#E8C06A; }
  #main { flex:1; min-width:0; display:flex; flex-direction:column; }
  #bar { flex:none; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px; border-bottom:1px solid rgba(255,255,255,.07); background:rgba(13,2,32,.6); }
  #bar .t { font-weight:700; font-size:13px; }
  #bar .t span { color:#8E78BE; font-weight:400; font-size:11.5px; margin-left:8px; }
  #bar .act { display:flex; gap:8px; }
  #bar .act a { font-size:11.5px; padding:5px 11px; border-radius:7px; border:1px solid rgba(232,192,106,.4); background:rgba(232,192,106,.1); }
  #stage { flex:1; min-height:0; background:#0D0220; }
  #frame { width:100%; height:100%; border:0; display:block; background:#0D0220; }
  #hint { padding:14px 16px; color:#6A5B8C; font-size:11px; border-top:1px solid rgba(255,255,255,.06); }
  @media (max-width: 820px) {
    #app { flex-direction:column; height:auto; }
    #side { width:100%; }
    #stage { height:80vh; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="brand">
      <div class="k">789BINGO · PH</div>
      <div class="n">CROWN RUSH</div>
      <div class="s">百关闯关活动 · 原型与需求文档</div>
    </div>
    <nav id="nav">
      <div class="grp">前台原型</div>
      <button class="item" data-src="pre-launch.html" data-title="活动预热页" data-sub="Pre-Launch · 英文版">活动预热页<span class="d">倒计时 · 奖池 · 参与方式 · 先行热身</span></button>
      <button class="item" data-src="live.html" data-title="活动进行中页" data-sub="Live · 英文版">活动进行中页<span class="d">闯关进度 · 关卡领取 · 榜单 · 领奖弹窗</span></button>
      <button class="item" data-src="ended.html" data-title="活动结束页" data-sub="Ended · 英文版">活动结束页<span class="d">成绩封存 · 领奖缓冲期</span></button>
      <div class="grp">需求文档</div>
      <button class="item" data-src="prd.html" data-title="开发需求文档" data-sub="PRD · 中文">开发需求文档 PRD<span class="d">业务流程 · 规则 · 后台 · 埋点 · Tips</span></button>
      <div id="toc">
        <button class="toc " data-anchor="sec-1-">1. 项目概述</button>
        <button class="toc " data-anchor="sec-2-">2. 整体业务流程</button>
        <button class="toc sub" data-anchor="sec-2-1">2.1 主流程（用户视角）</button>
        <button class="toc sub" data-anchor="sec-2-2">2.2 领取分支</button>
        <button class="toc sub" data-anchor="sec-2-3">2.3 物流信息修改流程</button>
        <button class="toc sub" data-anchor="sec-2-4">2.4 系统时序（后端视角）</button>
        <button class="toc " data-anchor="sec-3-">3. 业务规则</button>
        <button class="toc sub" data-anchor="sec-3-1">3.1 经验值（EXP）</button>
        <button class="toc sub" data-anchor="sec-3-2">3.2 关卡</button>
        <button class="toc sub" data-anchor="sec-3-3">3.3 奖励</button>
        <button class="toc sub" data-anchor="sec-3-4">3.4 风控</button>
        <button class="toc " data-anchor="sec-4-">4. 前台页面一：活动预热页</button>
        <button class="toc " data-anchor="sec-5-">5. 前台页面二：活动进行中页</button>
        <button class="toc sub" data-anchor="sec-5-1">5.1 物流信息流程</button>
        <button class="toc sub" data-anchor="sec-5-2">5.2 一键领取结果弹窗</button>
        <button class="toc sub" data-anchor="sec-5-3">5.3 实体奖品库存耗尽的降级规则</button>
        <button class="toc " data-anchor="sec-6-">6. 前台页面三：活动结束页（领奖缓冲）</button>
        <button class="toc " data-anchor="sec-7-">7. 运营后台需求</button>
        <button class="toc " data-anchor="sec-8-">8. 数据埋点需求</button>
        <button class="toc sub" data-anchor="sec-8-1">8.1 分析目标</button>
        <button class="toc sub" data-anchor="sec-8-2">8.2 公共参数</button>
        <button class="toc sub" data-anchor="sec-8-3">8.3 事件清单</button>
        <button class="toc sub" data-anchor="sec-8-4">8.4 运营看板指标</button>
        <button class="toc sub" data-anchor="sec-8-5">8.5 埋点实施要求</button>
        <button class="toc " data-anchor="sec-9-">9. 接口与异常</button>
        <button class="toc " data-anchor="sec-10-">10. 待确认事项</button>
        <button class="toc " data-anchor="sec-11-">11. 各角色协作 Tips</button>
      </div>
    </nav>
    <div id="hint">静态站点，无需构建。GitHub Pages 选择分支根目录即可访问。</div>
  </aside>
  <main id="main">
    <div id="bar">
      <div class="t" id="title">活动预热页 <span id="sub">Pre-Launch · 英文版</span></div>
      <div class="act"><a id="open" href="pre-launch.html" target="_blank" rel="noopener">新窗口打开 ↗</a></div>
    </div>
    <div id="stage"><iframe id="frame" src="pre-launch.html" title="preview"></iframe></div>
  </main>
</div>
<script>
  var items = Array.prototype.slice.call(document.querySelectorAll('.item'));
  var frame = document.getElementById('frame');
  var toc = document.getElementById('toc');
  var titleEl = document.getElementById('title');
  var subEl = document.getElementById('sub');
  var openEl = document.getElementById('open');
  var current = '';

  function select(btn, anchor) {
    var src = btn.getAttribute('data-src');
    items.forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    toc.classList.toggle('open', src === 'prd.html');
    titleEl.childNodes[0].nodeValue = btn.getAttribute('data-title') + ' ';
    subEl.textContent = btn.getAttribute('data-sub');
    var url = src + (anchor ? '#' + anchor : '');
    openEl.href = url;
    if (current === src && anchor) {
      try {
        var d = frame.contentDocument;
        var el = d && d.getElementById(anchor);
        if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      } catch (e) {}
    }
    current = src;
    frame.src = url;
    location.hash = src.replace('.html', '') + (anchor ? ':' + anchor : '');
  }

  items.forEach(function (btn) {
    btn.addEventListener('click', function () { select(btn, null); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.toc'), function (t) {
    t.addEventListener('click', function () {
      var prd = items.filter(function (b) { return b.getAttribute('data-src') === 'prd.html'; })[0];
      select(prd, t.getAttribute('data-anchor'));
    });
  });

  (function initFromHash() {
    var h = (location.hash || '').replace('#', '');
    var parts = h.split(':');
    var page = parts[0] ? parts[0] + '.html' : 'pre-launch.html';
    var match = items.filter(function (b) { return b.getAttribute('data-src') === page; })[0] || items[0];
    select(match, parts[1] || null);
  })();
</script>
</body>
</html>
