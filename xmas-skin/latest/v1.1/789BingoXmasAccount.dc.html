<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Account · 789Bingo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  html, body { margin:0; padding:0; background:#F7EBD6; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  a { color:#B3141C; text-decoration:none; }
  a:hover { color:#7E0F16; }
  @keyframes aSpin { to { transform:rotate(360deg); } }
  @keyframes aSnow { 0% { transform:translate3d(0,-12px,0); } 100% { transform:translate3d(var(--dx),150px,0); } }
  @keyframes aPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
</style>
</helmet>

<div style="position:relative;max-width:430px;margin:0 auto;min-height:100vh;background:radial-gradient(120% 40% at 50% 0%, #FFF8EA, #F7EBD6 60%);overflow-x:clip">

  <!-- PROFILE HEADER -->
  <div style="position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px 12px 16px;background:linear-gradient(90deg,#B3141C,#8E1013 60%,#6E0B10);border-bottom:2px solid #E8BF5A;box-shadow:0 -1px 0 rgba(255,236,180,.45) inset, 0 4px 10px rgba(80,0,0,.25)">
    <div style="position:relative;flex:none;width:50px;height:50px">
      <div style="width:50px;height:50px;border-radius:50%;overflow:hidden;border:2px solid #F4C658;background:#fff">
        <img src="../../../assets/x7890/acc-avatar.png" alt="" style="display:block;width:100%;height:100%;object-fit:cover" />
      </div>
      <div style="position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);padding:0 6px;border-radius:999px;background:#0F6B3A;border:1px solid #F4C658;color:#FFF3D6;font-size:9px;font-weight:900;white-space:nowrap">Lv 0</div>
    </div>
    <div style="flex:1;min-width:0">
      <div style="color:#FFF3D6;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(60,0,0,.45)">Player6rztg1111</div>
      <div style="margin-top:3px;display:flex;align-items:center;gap:6px;color:#FFE0B0;font-size:12.5px">
        <span>ID: Player6rztg1111</span>
        <span onClick="{{ copyId }}" aria-label="Copy ID" style="display:inline-flex;cursor:pointer">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="6" y="6" width="11" height="11" rx="2.5" fill="#F4C658" /><rect x="3" y="3" width="11" height="11" rx="2.5" stroke="#F4C658" stroke-width="1.8" /></svg>
        </span>
      </div>
    </div>
    <div style="flex:none;display:flex;gap:7px">
      <div onClick="{{ onSupport }}" aria-label="Support" style="width:28px;height:28px;border-radius:50%;background:rgba(255,243,214,.18);border:1.5px solid #F4C658;display:flex;align-items:center;justify-content:center;cursor:pointer">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 11V9a6 6 0 0 1 12 0v2" stroke="#FFE9A8" stroke-width="2" stroke-linecap="round" /><rect x="2.5" y="10" width="4" height="6" rx="1.6" fill="#FFE9A8" /><rect x="13.5" y="10" width="4" height="6" rx="1.6" fill="#FFE9A8" /></svg>
      </div>
      <div onClick="{{ onMsg }}" aria-label="Messages" style="position:relative;width:28px;height:28px;border-radius:50%;background:rgba(255,243,214,.18);border:1.5px solid #F4C658;display:flex;align-items:center;justify-content:center;cursor:pointer">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 9.5a7 6.5 0 1 1 3 5.4L3 16l.8-2.8A6.3 6.3 0 0 1 3 9.5Z" stroke="#FFE9A8" stroke-width="1.8" stroke-linejoin="round" /><path d="M7 8h6M7 11h4" stroke="#FFE9A8" stroke-width="1.8" stroke-linecap="round" /></svg>
        <span style="position:absolute;top:-1px;right:-1px;width:8px;height:8px;border-radius:50%;background:#2EE07A;border:1.5px solid #8E1013"></span>
      </div>
      <div onClick="{{ onSettings }}" aria-label="Settings" style="width:28px;height:28px;border-radius:50%;background:rgba(255,243,214,.18);border:1.5px solid #F4C658;display:flex;align-items:center;justify-content:center;cursor:pointer">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 2.5 16.5 6v8L10 17.5 3.5 14V6Z" stroke="#FFE9A8" stroke-width="1.8" stroke-linejoin="round" /><circle cx="10" cy="10" r="2.6" stroke="#FFE9A8" stroke-width="1.8" /></svg>
      </div>
    </div>
  </div>

  <div style="padding:10px 10px 0;display:flex;flex-direction:column;gap:10px">

    <!-- BALANCE -->
    <div style="position:relative;overflow:hidden;border-radius:14px;background:linear-gradient(110deg,#8E1013 0%,#B3141C 40%,#1F6B3F 80%,#0F4A2A 100%);border:2px solid #E8BF5A;box-shadow:0 0 0 1px rgba(255,238,190,.5) inset, 0 6px 16px rgba(120,20,10,.25);padding:13px 14px 14px">
      <div style="position:absolute;inset:0;pointer-events:none;overflow:hidden">{{ snow }}</div>
      <div style="position:relative;display:flex;align-items:center;gap:6px;color:#FFE9B0;font-size:13.5px;font-weight:700">
        <span>Account Balance</span>
        <span onClick="{{ toggleEye }}" aria-label="Toggle balance" style="display:inline-flex;cursor:pointer">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M1.8 10S5 4.5 10 4.5 18.2 10 18.2 10 15 15.5 10 15.5 1.8 10 1.8 10Z" stroke="#FFE9B0" stroke-width="1.8" stroke-linejoin="round" /><circle cx="10" cy="10" r="2.6" fill="#FFE9B0" /></svg>
        </span>
      </div>
      <div style="position:relative;margin-top:4px;display:flex;align-items:center;gap:8px">
        <span style="color:#FFD75E;font-size:27px;font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.35)">₱ {{ balanceText }}</span>
        <span onClick="{{ refresh }}" aria-label="Refresh" style="display:inline-flex;cursor:pointer;animation:{{ spinAnim }}">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3" stroke="#6FE3A4" stroke-width="2.2" stroke-linecap="round" /><path d="M15.5 2.5v4h-4" stroke="#6FE3A4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </span>
      </div>
      <div style="position:relative;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div onClick="{{ goDeposit }}" style="height:42px;border-radius:999px;background:linear-gradient(180deg,#FFF0B8,#F2C955 45%,#D19C2E);border:2px solid #FFF6DC;box-shadow:0 4px 10px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;gap:7px;color:#5A2E05;font-size:15.5px;font-weight:900;cursor:pointer" style-hover="filter:brightness(1.05)">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2.5" y="4.5" width="15" height="11" rx="2.5" fill="#8E1013" /><rect x="11" y="8" width="6.5" height="4" rx="1.4" fill="#F2C955" /></svg>
          <span>Deposit</span>
        </div>
        <div onClick="{{ goWithdraw }}" style="height:42px;border-radius:999px;background:linear-gradient(180deg,#3FB36E,#1F8E56 50%,#0F6B3A);border:2px solid #F0CE86;box-shadow:0 4px 10px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;gap:7px;color:#FFF3D6;font-size:15.5px;font-weight:900;cursor:pointer" style-hover="filter:brightness(1.06)">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2.5" y="4.5" width="15" height="11" rx="2.5" fill="#FFF3D6" /><path d="M2.5 8h15" stroke="#0F6B3A" stroke-width="1.8" /><path d="M5.5 12h3" stroke="#0F6B3A" stroke-width="1.8" stroke-linecap="round" /></svg>
          <span>Withdraw</span>
        </div>
      </div>
    </div>

    <!-- QUICK ENTRIES -->
    <div style="border-radius:14px;background:#FFFBF2;border:1.5px solid #EAD3A4;box-shadow:0 3px 10px rgba(120,60,10,.08);padding:12px 6px 10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))">
      <sc-for list="{{ quick }}" as="q" hint-placeholder-count="3">
        <div onClick="{{ q.onClick }}" style="display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer">
          <div style="width:50px;height:50px;border-radius:50%;background:{{ q.bg }};border:2px solid #E8BF5A;box-shadow:0 3px 8px rgba(120,20,10,.18), inset 0 1px 0 rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center">
            <img src="{{ q.img }}" alt="" style="display:block;width:34px;height:34px;object-fit:contain;mix-blend-mode:multiply" />
          </div>
          <div style="color:#3A120C;font-size:12px;font-weight:800;text-align:center;line-height:1.2">{{ q.name }}</div>
        </div>
      </sc-for>
    </div>

    <!-- MENU -->
    <div style="border-radius:14px;background:#FFFBF2;border:1.5px solid #EAD3A4;box-shadow:0 3px 10px rgba(120,60,10,.08);padding:4px 12px 12px">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="6">
        <div onClick="{{ m.onClick }}" style="display:flex;align-items:center;gap:10px;height:48px;border-bottom:1px dashed #EAD3A4;cursor:pointer">
          <div style="flex:none;width:32px;height:32px;border-radius:9px;background:linear-gradient(180deg,#FFF1D0,#FFE2A6);border:1px solid #E8BF5A;display:flex;align-items:center;justify-content:center">
            <img src="{{ m.img }}" alt="" style="display:block;width:24px;height:24px;object-fit:contain;mix-blend-mode:multiply" />
          </div>
          <div style="flex:1;min-width:0;color:#3A120C;font-size:14.5px;font-weight:800">{{ m.name }}</div>
          <sc-if value="{{ m.hasText }}">
            <span style="flex:none;color:#9A7A56;font-size:12.5px">{{ m.text }}</span>
          </sc-if>
          <sc-if value="{{ m.hasSocial }}">
            <span style="flex:none;display:flex;align-items:center;gap:5px">
              <img src="../../../assets/x7890/acc-social.png" alt="" style="display:block;height:18px;width:auto;mix-blend-mode:multiply" />
              <span style="padding:1px 7px;border-radius:999px;background:#E3F6EA;border:1px solid #9FDDB6;color:#0F6B3A;font-size:11px;font-weight:800">phone ✓</span>
            </span>
          </sc-if>
          <sc-if value="{{ m.hasBadge }}">
            <span style="flex:none;padding:4px 10px;border-radius:999px;background:linear-gradient(180deg,#E8323C,#B3141C);border:1px solid #F4C658;color:#FFF3D6;font-size:11.5px;font-weight:900;animation:aPulse 1.8s ease-in-out infinite">{{ m.badge }}</span>
          </sc-if>
          <span style="flex:none;color:#C4A57C;font-size:16px;font-weight:700">›</span>
        </div>
      </sc-for>

      <div style="position:relative;margin-top:12px;border-radius:10px;overflow:hidden;border:2px solid #E8BF5A;box-shadow:0 3px 10px rgba(120,20,10,.15);aspect-ratio:732/292;touch-action:pan-y" onPointerDown="{{ bDown }}" onPointerUp="{{ bUp }}">
        <div style="display:flex;height:100%;transition:transform .6s cubic-bezier(.3,.7,.3,1);transform:{{ bTransform }}">
          <sc-for list="{{ banners }}" as="b" hint-placeholder-count="4">
            <img src="{{ b.img }}" alt="{{ b.alt }}" onClick="{{ b.onClick }}" style="display:block;flex:0 0 100%;width:100%;height:100%;object-fit:cover;cursor:pointer" />
          </sc-for>
        </div>
        <div style="position:absolute;left:0;right:0;bottom:17%;display:flex;justify-content:center;gap:5px;pointer-events:none">
          <sc-for list="{{ bDots }}" as="d" hint-placeholder-count="4">
            <span style="height:5px;border-radius:3px;width:{{ d.w }};background:{{ d.c }};box-shadow:0 0 3px rgba(0,0,0,.4);transition:all .3s"></span>
          </sc-for>
        </div>
      </div>
    </div>

    <div onClick="{{ onLegal }}" style="margin-top:4px;text-align:center;color:#7A2A12;font-size:14px;font-weight:800;text-decoration:underline;text-underline-offset:4px;text-decoration-color:#D9A23A;cursor:pointer">About &amp; Legal</div>
    <div style="display:flex;justify-content:center;padding:4px 0 0">
      <img src="../../../assets/x7890/acc-legal.png" alt="PAGCOR · 21+" style="display:block;width:74%;height:auto;mix-blend-mode:multiply" />
    </div>
  </div>

  <div style="height:104px"></div>

  <!-- BOTTOM NAV -->
  <div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:20;width:100%;max-width:430px;display:flex;align-items:flex-end;padding:5px 4px 6px;background:radial-gradient(120% 140% at 50% 0%, #1F5A3A 0%, #0F3B25 55%, #082717 100%);border-top:2px solid #E8BF5A;box-shadow:0 -1px 0 rgba(255,236,180,.45) inset, 0 -6px 16px rgba(20,40,20,.28)">
    <sc-for list="{{ navs }}" as="n" hint-placeholder-count="5">
      <div onClick="{{ n.onClick }}" style="flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer">
        <img src="{{ n.img }}?v=7" alt="" style="width:{{ n.size }};height:auto;margin-top:{{ n.lift }};filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)) drop-shadow(0 0 6px rgba(255,214,120,.25))" />
        <span style="font-size:11.5px;font-weight:900;color:{{ n.color }};text-shadow:0 1px 2px rgba(0,0,0,.5)">{{ n.name }}</span>
        <span style="width:18px;height:3px;border-radius:2px;background:{{ n.bar }};margin-top:2px"></span>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{ hasToast }}">
    <div style="position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:40;padding:9px 16px;border-radius:999px;background:rgba(58,18,12,.9);border:1px solid #E8BF5A;color:#FFF3D6;font-size:12.5px;font-weight:800;white-space:nowrap">{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:932}}">
class Component extends DCLogic {
  state = { hide: false, spinning: false, toast: '', bIdx: 0 };
  componentDidMount() { this.startB(); }
  startB() { clearInterval(this.bt); this.bt = setInterval(() => this.setState(s => ({ bIdx: (s.bIdx + 1) % 4 })), 3000); }
  componentWillUnmount() { clearTimeout(this.tt); clearTimeout(this.st); clearInterval(this.bt); }
  flash(t) { clearTimeout(this.tt); this.setState({ toast: t }); this.tt = setTimeout(() => this.setState({ toast: '' }), 1800); }
  renderVals() {
    const s = this.state, W = './789BingoXmasWallet.dc.html';
    if (!this.flakes) {
      this.flakes = React.createElement(React.Fragment, null, Array.from({ length: 16 }, (_, i) => {
        const size = 2 + (i % 3) * 1.2;
        return React.createElement('span', { key: i, style: {
          position: 'absolute', top: '-10px', left: ((i * 29) % 100) + '%', width: size + 'px', height: size + 'px',
          borderRadius: '50%', background: 'rgba(255,255,255,.9)', opacity: 0.4 + (i % 4) * 0.14,
          '--dx': ((i % 5) - 2) * 8 + 'px', animation: 'aSnow ' + (4 + (i * 7 % 5)) + 's linear infinite',
          animationDelay: '-' + ((i * 0.9) % 6).toFixed(1) + 's'
        } });
      }));
    }
    const qs = [
      ['Overview', 'linear-gradient(180deg,#E3F6EA,#BFE8CD)'],
      ['Transaction History', 'linear-gradient(180deg,#FFE6E6,#F9C2C2)'],
      ['Bet History', 'linear-gradient(180deg,#FFF1D0,#FFE2A6)']
    ];
    const ms = [
      { name: 'Rewards', text: 'Tap To Claim Gifts' },
      { name: 'KYC Verification', text: 'Unverified' },
      { name: 'Account Security', social: true },
      { name: 'Level Center', badge: 'Big Rewards Await' },
      { name: 'Betting Limit' },
      { name: 'App Download' }
    ];
    const navNames = ['Home', 'Chat', 'Invite', 'Wallet', 'Account'];
    return {
      snow: this.flakes,
      balanceText: s.hide ? '****' : '100.00',
      toggleEye: () => this.setState({ hide: !s.hide }),
      spinAnim: s.spinning ? 'aSpin .8s linear infinite' : 'none',
      refresh: () => { this.setState({ spinning: true }); clearTimeout(this.st); this.st = setTimeout(() => { this.setState({ spinning: false }); this.flash('Balance updated'); }, 900); },
      copyId: () => this.flash('ID copied'),
      onSupport: () => this.flash('Connecting to customer service…'),
      onMsg: () => this.flash('Opening messages…'),
      onSettings: () => this.flash('Opening settings…'),
      goDeposit: () => { window.location.href = W; },
      goWithdraw: () => { window.location.href = W; },
      quick: qs.map((q, i) => ({ name: q[0], bg: q[1], img: '../../../assets/x7890/acc-q' + i + '.png', onClick: () => this.flash('Opening ' + q[0] + '…') })),
      menu: ms.map((m, i) => ({
        name: m.name, img: '../../../assets/x7890/acc-i' + i + '.png',
        text: m.text || '', hasText: !!m.text, hasSocial: !!m.social, badge: m.badge || '', hasBadge: !!m.badge,
        onClick: () => { if (m.name === 'Level Center') { window.location.href = './789BingoXmasLevel.dc.html'; } else if (m.name === 'Rewards') { window.location.href = './789BingoXmasPromotions.dc.html'; } else { this.flash('Opening ' + m.name + '…'); } }
      })),
      banners: ['Real Time Cashback', 'Daily Login Rewards', '10% Deposit Bonus', 'Daily Rebate'].map((t, i) => ({
        img: '../../../assets/x7890/acc-b' + i + '.png', alt: t, onClick: () => this.flash('Opening ' + t + '…')
      })),
      bTransform: 'translateX(-' + (s.bIdx * 100) + '%)',
      bDots: [0, 1, 2, 3].map(i => ({ w: i === s.bIdx ? '16px' : '5px', c: i === s.bIdx ? '#FFD66B' : 'rgba(255,255,255,.75)' })),
      bDown: (e) => { this.bx = e.clientX; },
      bUp: (e) => {
        if (this.bx == null) return;
        const dx = e.clientX - this.bx; this.bx = null;
        if (Math.abs(dx) < 30) return;
        this.setState({ bIdx: (s.bIdx + (dx < 0 ? 1 : 3)) % 4 }); this.startB();
      },
      onLegal: () => this.flash('Opening About & Legal…'),
      navs: navNames.map((n, i) => {
        const mid = i === 2, on = i === 4;
        return { name: n, img: '../../../assets/x7890/nav' + i + '.png', size: mid ? '78px' : '38px', lift: mid ? '-34px' : '0', color: on ? '#FFD66B' : '#FFF3D6', bar: on ? '#FFD66B' : 'transparent',
          onClick: () => {
            if (i === 0) { window.location.href = './789BingoXmasSkinLoggedIn.dc.html'; return; }
            if (i === 1) { window.location.href = './789BingoXmasChat.dc.html'; return; }
            if (i === 2) { window.location.href = './789BingoXmasInvite.dc.html'; return; }
            if (i === 3) { window.location.href = W; return; }
          } };
      }),
      toast: s.toast, hasToast: !!s.toast
    };
  }
}
</script>
</body>
</html>
