<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>789Bingo Chat Room</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#8E1013" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  html, body { margin:0; padding:0; background:#EDE6DD; }
  body { font-family:Nunito, system-ui, sans-serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  a { color:#8E1013; text-decoration:none; }
  a:hover { color:#0F6B3A; }
  img { -webkit-user-drag:none; user-select:none; }
  @keyframes xbMarquee { from { transform:translateX(0); } to { transform:translateX(-50%); } }
</style>
</helmet>

<div style="position:relative;max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:#FBF6EE;overflow:hidden">

  <!-- HEADER -->
  <div style="flex:none;display:flex;align-items:center;gap:8px;height:48px;padding:0 12px 0 14px;background:linear-gradient(90deg,#B3141C,#8E1013 60%,#6E0B10);border-bottom:2px solid #E8BF5A;box-shadow:0 -1px 0 rgba(255,236,180,.45) inset">
    <div style="flex:1;min-width:0;color:#FFF3D6;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(60,0,0,.45)">789Bingo Chat Room ({{ onlineText }})</div>
    <div onClick="{{ onSupport }}" aria-label="Support" style="flex:none;width:26px;height:26px;border-radius:50%;background:rgba(255,243,214,.18);border:1.5px solid #F4C658;display:flex;align-items:center;justify-content:center;cursor:pointer">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 11V9a6 6 0 0 1 12 0v2" stroke="#FFE9A8" stroke-width="2" stroke-linecap="round" /><rect x="2.5" y="10" width="4" height="6" rx="1.6" fill="#FFE9A8" /><rect x="13.5" y="10" width="4" height="6" rx="1.6" fill="#FFE9A8" /></svg>
    </div>
    <div onClick="{{ onInfo }}" aria-label="Info" style="flex:none;width:26px;height:26px;border-radius:50%;background:rgba(255,243,214,.18);border:1.5px solid #F4C658;display:flex;align-items:center;justify-content:center;color:#FFE9A8;font-size:14px;font-weight:900;cursor:pointer">i</div>
    <div onClick="{{ onClose }}" aria-label="Close" style="flex:none;width:26px;height:26px;border-radius:50%;background:rgba(255,243,214,.18);border:1.5px solid #F4C658;display:flex;align-items:center;justify-content:center;color:#FFE9A8;font-size:13px;font-weight:900;cursor:pointer">✕</div>
  </div>

  <!-- NOTICE -->
  <div style="flex:none;display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;background:#FFF1CC;border-bottom:1px solid #EFD9A6;overflow:hidden">
    <span style="flex:none;color:#B3141C;font-size:13px">📢</span>
    <div style="flex:1;min-width:0;overflow:hidden">{{ marquee }}</div>
  </div>

  <!-- MESSAGES -->
  <div ref="{{ listRef }}" style="flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:14px">
    <sc-for list="{{ messages }}" as="m" hint-placeholder-count="8">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <div style="position:relative;flex:none;width:48px;height:48px">
          <div style="width:48px;height:48px;border-radius:50%;overflow:hidden;border:2px solid #E8BF5A;background:#fff">
            <img src="{{ m.avatar }}" alt="" style="display:block;width:100%;height:100%;object-fit:cover" />
          </div>
          <div style="position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);padding:0 6px;border-radius:999px;background:#0F6B3A;border:1px solid #F4C658;color:#FFF3D6;font-size:9px;font-weight:900;white-space:nowrap">Lv 0</div>
        </div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:baseline;gap:8px">
            <span style="color:#3A120C;font-size:13.5px;font-weight:900">{{ m.name }}</span>
            <span style="color:#A07A5A;font-size:12px;font-weight:700">{{ m.time }}</span>
          </div>
          <sc-if value="{{ m.isText }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex;margin-top:6px">
              <div style="max-width:100%;padding:9px 14px;border-radius:4px 12px 12px 12px;background:{{ m.bubbleBg }};border:1px solid {{ m.bubbleBorder }};color:#3A120C;font-size:13.5px;font-weight:700;word-break:break-word">{{ m.text }}</div>
            </div>
          </sc-if>
          <sc-if value="{{ m.isSticker }}">
            <div style="position:relative;margin-top:6px;width:200px;height:164px;border-radius:12px;background:#F4ECDF;border:1px solid #EAD9BD;display:flex;align-items:center;justify-content:center;overflow:hidden">
              <img src="../assets/x7890/chat-sticker.png" alt="Sticker" style="display:block;height:140px;width:auto;mix-blend-mode:multiply" />
              <div style="position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;background:rgba(58,18,12,.72);display:flex;align-items:center;justify-content:center">
                <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" stroke="#fff" stroke-width="2" /><path d="M13 13l4 4M8.5 6v5M6 8.5h5" stroke="#fff" stroke-width="2" stroke-linecap="round" /></svg>
              </div>
            </div>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- INPUT -->
  <div style="flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px;background:#F4ECDF;border-top:1px solid #EAD9BD">
    <div style="flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 14px;border-radius:10px;background:#fff;border:1.5px solid {{ inputBorder }}">
      <input value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onKey }}" placeholder="Write your message..." style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:Nunito,system-ui,sans-serif;font-size:14px;font-weight:700;color:#3A120C" />
      <div onClick="{{ onGif }}" style="flex:none;padding:1px 4px;border-radius:4px;border:1.5px solid #B08A6A;color:#8E1013;font-size:9px;font-weight:900;cursor:pointer">GIF</div>
    </div>
    <div onClick="{{ onSend }}" aria-label="Send" style="flex:none;width:40px;height:40px;border-radius:10px;background:{{ sendBg }};border:1.5px solid #E8BF5A;display:flex;align-items:center;justify-content:center;color:#FFF3D6;font-size:22px;font-weight:700;cursor:pointer">{{ sendIcon }}</div>
  </div>

  <div style="flex:none;height:72px"></div>

  <!-- BOTTOM NAV -->
  <div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:20;width:100%;max-width:430px;display:flex;align-items:flex-end;padding:5px 4px 6px;background:radial-gradient(120% 140% at 50% 0%, #1F5A3A 0%, #0F3B25 55%, #082717 100%);border-top:2px solid #E8BF5A;box-shadow:0 -1px 0 rgba(255,236,180,.45) inset, 0 -6px 16px rgba(20,40,20,.28)">
    <sc-for list="{{ navs }}" as="n" hint-placeholder-count="5">
      <div onClick="{{ n.onClick }}" style="flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer">
        <img src="{{ n.img }}?v=7" alt="" style="width:{{ n.size }};height:auto;margin-top:{{ n.lift }};filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)) drop-shadow(0 0 6px rgba(255,214,120,.25))" />
        <span style="font-size:11.5px;font-weight:900;color:{{ n.color }};text-shadow:0 1px 2px rgba(0,0,0,.5)">{{ n.name }}</span>
        <span style="width:18px;height:3px;border-radius:2px;background:{{ n.bar }};margin-top:2px"></span>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{ hasToast }}">
    <div style="position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:40;padding:9px 16px;border-radius:999px;background:rgba(58,18,12,.9);border:1px solid #E8BF5A;color:#FFF3D6;font-size:12.5px;font-weight:800;white-space:nowrap">{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:932}}">
class Component extends DCLogic {
  state = {
    draft: '', toast: '',
    messages: [
      ['cat', 'Player8fkqp2606', '18:07', '888888'],
      ['man', 'Player238bg7489', '18:09', '1'],
      ['man', 'Player238bg7489', '18:10', '2'],
      ['man', 'Playerjb9mu2137', '18:10', '1'],
      ['man', 'Playerqa00001', '18:26', '1'],
      ['cat', 'Player8fkqp2606', '18:27', '777'],
      ['cat', 'Player8fkqp2606', '18:28', 'Good luck! test123'],
      ['cat', 'Player8585vppkk', '18:29', 'Good luck! test123'],
      ['man', 'Playeriiqgp2138', '18:31', null]
    ]
  };
  componentDidMount() { this.scrollBottom(); }
  componentWillUnmount() { clearTimeout(this.tt); }
  scrollBottom() { setTimeout(() => { if (this.list) this.list.scrollTop = this.list.scrollHeight; }, 60); }
  flash(t) { clearTimeout(this.tt); this.setState({ toast: t }); this.tt = setTimeout(() => this.setState({ toast: '' }), 1800); }
  send() {
    const t = this.state.draft.trim();
    if (!t) return;
    const d = new Date(), hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    this.setState(st => ({ draft: '', messages: st.messages.concat([['cat', 'bi****168', hm, t]]) }));
    this.scrollBottom();
  }
  renderVals() {
    const s = this.state;
    const notice = 'Hi, everybody! Maligayang Pasko from 789Bingo — Crown Rush 100-Stage Challenge is LIVE. Be kind, have fun and good luck!';
    const navNames = ['Home', 'Chat', 'Invite', 'Wallet', 'Account'];
    const hasDraft = s.draft.trim().length > 0;
    return {
      onlineText: '10,833',
      marquee: React.createElement('div', { style: { display: 'flex', whiteSpace: 'nowrap', animation: 'xbMarquee 20s linear infinite', fontSize: '12.5px', fontWeight: 800, color: '#6E0B10' } },
        React.createElement('span', { style: { paddingRight: '40px' } }, notice), React.createElement('span', { style: { paddingRight: '40px' } }, notice)),
      messages: s.messages.map((m, i) => {
        const mine = m[1] === 'bi****168';
        return {
          avatar: '../assets/x7890/chat-' + m[0] + '2.png', name: m[1], time: m[2],
          text: m[3], isText: m[3] != null, isSticker: m[3] == null,
          bubbleBg: mine ? '#FFF1CC' : (m[0] === 'man' ? '#F7E3E1' : 'transparent'),
          bubbleBorder: mine ? '#E8BF5A' : (m[0] === 'man' ? '#EDC9C4' : 'transparent')
        };
      }),
      listRef: el => { this.list = el; },
      draft: s.draft,
      onDraft: e => this.setState({ draft: e.target.value }),
      onKey: e => { if (e.key === 'Enter') this.send(); },
      onSend: () => hasDraft ? this.send() : this.flash('Emoji & stickers'),
      sendIcon: hasDraft ? '➤' : '+',
      sendBg: hasDraft ? 'linear-gradient(180deg,#D8242F,#8E1013)' : 'linear-gradient(180deg,#2E9A58,#0F6B3A)',
      inputBorder: hasDraft ? '#E8BF5A' : '#EAD9BD',
      onGif: () => this.flash('GIF stickers'),
      onSupport: () => this.flash('Connecting to 24/7 Customer Service…'),
      onInfo: () => this.flash('Chat rules: be respectful, no spam'),
      onClose: () => { window.location.href = './789BingoXmasSkinLoggedIn.dc.html'; },
      navs: navNames.map((n, i) => {
        const mid = i === 2, on = i === 1;
        return { name: n, img: '../assets/x7890/nav' + i + '.png', size: mid ? '78px' : '38px', lift: mid ? '-34px' : '0', color: on ? '#FFD66B' : '#FFF3D6', bar: on ? '#FFD66B' : 'transparent',
          onClick: () => {
            if (i === 0) { window.location.href = './789BingoXmasSkinLoggedIn.dc.html'; return; }
            if (i === 1) return;
            if (i === 2) { window.location.href = './789BingoXmasInvite.dc.html'; return; }
            if (i === 3) { window.location.href = './789BingoXmasWallet.dc.html'; return; }
            if (i === 4) { window.location.href = './789BingoXmasAccount.dc.html'; return; }
            this.flash('Opening ' + n + '…');
          } };
      }),
      toast: s.toast, hasToast: !!s.toast
    };
  }
}
</script>
</body>
</html>
