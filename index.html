<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>789Bingo · 需求与原型中心</title>
<style>
  html, body { margin:0; height:100%; background:#F6F3EE; font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:#2A1A10; }
  * { box-sizing:border-box; }
  a { color:#8E0F17; text-decoration:none; }
  a:hover { color:#B3141C; }
  .app { display:flex; height:100vh; }
  .side { flex:none; width:290px; display:flex; flex-direction:column; background:#16052F; color:#E8DCF8; }
  .brand { padding:18px 18px 14px; border-bottom:1px solid rgba(255,255,255,.08); }
  .brand .k { font-size:11px; letter-spacing:.24em; color:#C89A3C; font-weight:700; }
  .brand .t { margin-top:4px; font-size:17px; font-weight:800; color:#FFF6E2; }
  .search { margin:12px 14px 6px; }
  .search input { width:100%; height:32px; border-radius:8px; border:1px solid rgba(232,220,248,.2); background:rgba(255,255,255,.06); color:#FFF6E2; padding:0 10px; font-size:13px; outline:none; }
  .search input::placeholder { color:#9C8BB8; }
  .tree { flex:1; overflow-y:auto; padding:6px 8px 20px; }
  .node { user-select:none; }
  .row { display:flex; align-items:center; gap:7px; padding:7px 8px; border-radius:7px; cursor:pointer; font-size:13px; line-height:1.35; }
  .row:hover { background:rgba(255,255,255,.07); }
  .row.active { background:#E8C06A; color:#16052F; font-weight:700; }
  .row.active .tag { background:#16052F; color:#E8C06A; }
  .caret { flex:none; width:12px; font-size:10px; color:#9C8BB8; transition:transform .15s; }
  .caret.open { transform:rotate(90deg); }
  .l0 > .row { font-weight:800; font-size:14px; color:#FFF6E2; margin-top:6px; }
  .l1 > .row { font-weight:700; color:#F5E6C0; }
  .l1 .desc { font-size:11px; color:#9C8BB8; font-weight:400; margin-left:4px; }
  .kids { padding-left:14px; border-left:1px dashed rgba(232,220,248,.14); margin-left:13px; }
  .tag { flex:none; padding:1px 6px; border-radius:4px; font-size:10.5px; font-weight:800; }
  .tag.doc { background:rgba(46,154,88,.25); color:#8FE3B8; }
  .tag.page { background:rgba(216,36,47,.25); color:#FFB3B3; }
  .tag.admin { background:rgba(140,110,220,.28); color:#D3C4FF; }
  .name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .bar { flex:none; height:46px; display:flex; align-items:center; gap:10px; padding:0 16px; background:#fff; border-bottom:1px solid #E6DED2; font-size:13px; }
  .crumb { flex:1; min-width:0; color:#7A6A58; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crumb b { color:#2A1A10; }
  .btn { flex:none; padding:5px 12px; border-radius:6px; border:1px solid #E6DED2; color:#5A3A1A; font-size:12.5px; cursor:pointer; background:#fff; }
  .btn:hover { background:#FAF6EF; }
  iframe { flex:1; width:100%; border:0; background:#fff; }
  .toggle { display:none; }
  @media (max-width: 820px) {
    .side { position:fixed; z-index:20; top:0; bottom:0; left:0; transform:translateX(-100%); transition:transform .2s; box-shadow:6px 0 20px rgba(0,0,0,.3); }
    .side.show { transform:none; }
    .toggle { display:inline-block; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="k">789BINGO</div><div class="t">需求与原型中心</div></div>
    <div class="search"><input id="q" placeholder="搜索页面或文档…" /></div>
    <div class="tree" id="tree"></div>
  </aside>
  <main class="main">
    <div class="bar">
      <span class="btn toggle" id="tg">☰ 目录</span>
      <div class="crumb" id="crumb"></div>
      <a class="btn" id="newtab" target="_blank" rel="noopener">新窗口打开 ↗</a>
    </div>
    <iframe id="view" title="内容"></iframe>
  </main>
</div>
<script>
const CR = [
  ['开发需求 PRD', 'Crown Rush PRD.dc.html', 'doc'],
  ['需求速览', 'Crown Rush PRD Overview.dc.html', 'doc'],
  ['开发自查清单', 'Crown Rush Dev Checklist.dc.html', 'doc'],
  ['后台操作手册', 'Crown Rush Admin Manual.dc.html', 'doc'],
  ['活动预热页', 'Crown Rush Pre-Launch.dc.html', 'page'],
  ['活动进行中页', 'Crown Rush Live.dc.html', 'page'],
  ['活动结束页', 'Crown Rush Ended.dc.html', 'page'],
  ['后台管理 · 流水闯关活动', 'Crown Rush Admin.dc.html', 'admin']
];
const files = (dir, list) => list.map(([name, f, t]) => ({ name, path: dir + '/' + f, type: t }));
const noPages = l => l.filter(x => x[2] !== 'page');
const TREE = [
  { name: '项目导航', path: '项目导航.dc.html', type: 'doc' },
  { name: '流水闯关活动', key: 'cr', children: [
    { name: '完整需求', desc: '基线', key: 'cr-full', children: files('crown-rush', CR) },
    { name: 'v1.0 迭代', desc: '前台全量 + 后台精简', key: 'cr-10', children: files('crown-rush/v1.0', CR) },
    { name: 'v1.1 迭代', desc: '仅后台', key: 'cr-11', children: files('crown-rush/v1.1', noPages(CR)) },
    { name: 'v1.2 迭代', desc: '仅后台 · 完整', key: 'cr-12', children: files('crown-rush/v1.2', noPages(CR)) }
  ]},
  { name: '圣诞换肤', key: 'xs', children: [
    { name: '需求文档', key: 'xs-doc', children: files('xmas-skin', [['换肤需求 PRD', '789BingoSkinPRD.dc.html', 'doc'], ['后台 · 节日皮肤管理', 'Skin Admin.dc.html', 'admin'], ['后台操作手册', 'Skin Admin Manual.dc.html', 'doc']]) },
    { name: '页面原型', key: 'xs-pages', children: files('xmas-skin', [
      ['首页 · 未登录', '789BingoXmasSkin.dc.html', 'page'], ['首页 · 已登录', '789BingoXmasSkinLoggedIn.dc.html', 'page'],
      ['登录页', '789BingoMaxSkinLogin.dc.html', 'page'], ['Promotions', '789BingoXmasPromotions.dc.html', 'page'],
      ['钱包', '789BingoXmasWallet.dc.html', 'page'], ['个人中心', '789BingoXmasAccount.dc.html', 'page'],
      ['等级中心', '789BingoXmasLevel.dc.html', 'page'], ['聊天室', '789BingoXmasChat.dc.html', 'page'],
      ['邀请', '789BingoXmasInvite.dc.html', 'page'], ['游戏查询', '789BingoXmasSearch.dc.html', 'page']
    ]) }
  ]}
];
const TAG = { doc: '文档', page: '页面', admin: '后台' };
const byPath = {}, parents = {};
(function index(nodes, trail) { nodes.forEach(n => { const t = trail.concat([n]); if (n.path) { byPath[n.path] = n; parents[n.path] = t; } if (n.children) index(n.children, t); }); })(TREE, []);
const open = JSON.parse(localStorage.getItem('navOpen') || '{"cr":true,"cr-full":true,"xs":true}');
let current = '', query = '';
const $ = id => document.getElementById(id);
function match(n) { if (!query) return true; if (n.path) return (n.name + ' ' + n.path).toLowerCase().includes(query); return (n.children || []).some(match); }
function render() {
  const tree = $('tree'); tree.innerHTML = '';
  const build = (nodes, lvl, host) => nodes.forEach(n => {
    if (!match(n)) return;
    const box = document.createElement('div'); box.className = 'node l' + lvl;
    const row = document.createElement('div'); row.className = 'row' + (n.path && n.path === current ? ' active' : '');
    if (n.children) {
      const isOpen = query ? true : !!open[n.key];
      row.innerHTML = '<span class="caret' + (isOpen ? ' open' : '') + '">▶</span><span class="name">' + n.name + (n.desc ? '<span class="desc">' + n.desc + '</span>' : '') + '</span>';
      row.onclick = () => { open[n.key] = !open[n.key]; localStorage.setItem('navOpen', JSON.stringify(open)); render(); };
      box.appendChild(row);
      if (isOpen) { const kids = document.createElement('div'); kids.className = 'kids'; build(n.children, lvl + 1, kids); box.appendChild(kids); }
    } else {
      row.innerHTML = '<span class="tag ' + n.type + '">' + TAG[n.type] + '</span><span class="name">' + n.name + '</span>';
      row.title = n.path;
      row.onclick = () => { go(n.path); $('side').classList.remove('show'); };
      box.appendChild(row);
    }
    host.appendChild(box);
  });
  build(TREE, 0, tree);
}
function crumbOf(path) {
  const t = parents[path];
  return t ? t.map((n, i) => i === t.length - 1 ? '<b>' + n.name + '</b>' : n.name).join(' › ') : '<b>' + decodeURIComponent(path) + '</b>';
}
function go(path, fromFrame) {
  const clean = path.split('#')[0];
  current = clean;
  (parents[clean] || []).forEach(n => { if (n.key) open[n.key] = true; });
  if (!fromFrame) $('view').src = encodeURI(path);
  $('crumb').innerHTML = crumbOf(clean);
  $('newtab').href = encodeURI(path);
  const h = '#/' + path;
  if (location.hash !== h) history.replaceState(null, '', h);
  document.title = (byPath[clean] ? byPath[clean].name + ' · ' : '') + '789Bingo 需求与原型中心';
  render();
}
$('view').addEventListener('load', () => {
  try {
    const loc = $('view').contentWindow.location;
    const base = location.href.replace(/[#?].*$/, '').replace(/[^/]*$/, '');
    let rel = decodeURIComponent(loc.href.replace(base, '').replace(/[?].*$/, ''));
    if (rel && rel.split('#')[0] !== current) go(rel, true);
  } catch (e) {}
});
$('q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); render(); });
$('tg').onclick = () => $('side').classList.toggle('show');
window.addEventListener('hashchange', () => { const p = decodeURIComponent(location.hash.replace(/^#\//, '')); if (p && p.split('#')[0] !== current) go(p); });
const start = decodeURIComponent(location.hash.replace(/^#\//, '')) || '项目导航.dc.html';
go(start);
</script>
</body>
</html>
