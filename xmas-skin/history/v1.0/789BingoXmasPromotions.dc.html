<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Promotions · 789Bingo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  html, body { margin:0; padding:0; background:#F7EBD6; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  a { color:#B3141C; text-decoration:none; }
  a:hover { color:#8E0F17; }
  @keyframes pSnow { 0% { transform:translateY(-10px); } 100% { transform:translateY(120px); } }
  @keyframes pToast { from { opacity:0; transform:translate(-50%,8px); } to { opacity:1; transform:translate(-50%,0); } }
</style>
</helmet>

<div style="max-width:430px;margin:0 auto;min-height:100vh;background:#F7EBD6;position:relative;padding-bottom:24px">

  <div style="position:sticky;top:0;z-index:20;background:radial-gradient(120% 140% at 50% 0%, #C21F28 0%, #8E0F17 70%, #6A0A12 100%);overflow:hidden;box-shadow:0 3px 10px rgba(80,0,8,.25)">
    <div style="position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(90deg,#fff 0 12px,#D8242F 12px 24px,#0F6B3A 24px 36px);opacity:.9"></div>
    <div style="position:absolute;inset:0;pointer-events:none">
      <sc-for list="{{ snow }}" as="f" hint-placeholder-count="0">
        <span style="position:absolute;top:-8px;left:{{ f.left }};width:{{ f.size }};height:{{ f.size }};border-radius:50%;background:#fff;opacity:{{ f.op }};animation:pSnow {{ f.dur }} linear infinite;animation-delay:{{ f.delay }}"></span>
      </sc-for>
    </div>

    <div style="position:relative;display:flex;align-items:center;justify-content:center;height:52px;margin-top:4px">
      <div onClick="{{ goBack }}" style="position:absolute;left:10px;top:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFE9B0">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M12.5 4 6.5 10l6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </div>
      <div style="color:#FFF3D6;font-weight:800;font-size:17px">Promotions</div>
    </div>

    <div style="position:relative;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 10px 12px">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <div onClick="{{ t.onClick }}" style="flex:none;padding:7px 16px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;background:{{ t.bg }};border:1.5px solid {{ t.border }};color:{{ t.color }}">{{ t.label }}</div>
      </sc-for>
    </div>
    <div style="position:relative;height:9px;background:radial-gradient(9px 7px at 6% 0,#fff 98%,transparent),radial-gradient(13px 8px at 22% 0,#fff 98%,transparent),radial-gradient(10px 7px at 40% 0,#fff 98%,transparent),radial-gradient(14px 8px at 60% 0,#fff 98%,transparent),radial-gradient(10px 7px at 78% 0,#fff 98%,transparent),radial-gradient(12px 8px at 94% 0,#fff 98%,transparent)"></div>
  </div>

  <div style="padding:12px 10px 0;display:flex;flex-direction:column;gap:14px">
    <sc-for list="{{ promos }}" as="p" hint-placeholder-count="3">
      <div style="position:relative;border-radius:16px;background:#FFFDF6;border:1.5px solid #EBC977;box-shadow:0 4px 12px rgba(120,20,10,.08);padding:8px 8px 10px">
        <div style="position:absolute;left:10px;right:10px;top:-5px;height:9px;border-radius:9px 9px 0 0;background:radial-gradient(8px 6px at 8% 100%,#fff 98%,transparent),radial-gradient(12px 7px at 28% 100%,#fff 98%,transparent),radial-gradient(10px 6px at 52% 100%,#fff 98%,transparent),radial-gradient(13px 7px at 74% 100%,#fff 98%,transparent),radial-gradient(9px 6px at 92% 100%,#fff 98%,transparent)"></div>
        <div onClick="{{ p.onClick }}" style="border-radius:11px;overflow:hidden;cursor:pointer;background:#F3E4C4">
          <img src="{{ p.img }}" alt="{{ p.title }}" style="display:block;width:100%;height:auto" />
        </div>
        <div style="margin-top:9px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px">
          <div style="min-width:0;display:flex;align-items:center;gap:6px">
            <span style="flex:none;padding:2px 7px;border-radius:6px;background:#E6F3EA;color:#0F6B3A;font-size:10px;font-weight:800">{{ p.tag }}</span>
            <span style="font-size:14px;font-weight:800;color:#3A2410;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.title }}</span>
          </div>
          <div onClick="{{ p.onClick }}" style="flex:none;padding:7px 16px;border-radius:999px;background:linear-gradient(180deg,#E03A44,#9A0F18);border:1.5px solid #F4C658;color:#FFF3D6;font-size:12.5px;font-weight:800;cursor:pointer;box-shadow:0 3px 8px rgba(140,10,20,.25)" style-hover="filter:brightness(1.08)">Details</div>
        </div>
      </div>
    </sc-for>
    <sc-if value="{{ isEmpty }}">
      <div style="padding:40px 0;text-align:center;color:#9A6A2A;font-size:13px">No promotions in this category yet</div>
    </sc-if>
  </div>

  <sc-if value="{{ hasToast }}">
    <div style="position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:50;padding:9px 16px;border-radius:999px;background:rgba(58,8,12,.92);border:1px solid #F4C658;color:#FFF3D6;font-size:12.5px;font-weight:700;white-space:nowrap;animation:pToast .25s ease">{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 'All', toast: '' };
  flakes = Array.from({ length: 14 }, (_, i) => ({
    left: ((i * 43) % 97) + '%', size: (2 + (i % 3)) + 'px', op: (0.4 + (i % 4) * 0.15).toFixed(2),
    dur: (4 + (i % 4)) + 's', delay: (-(i * 0.6)).toFixed(1) + 's'
  }));
  componentWillUnmount() { clearTimeout(this.tt); }
  flash(t) { this.setState({ toast: t }); clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toast: '' }), 1800); }
  renderVals() {
    const s = this.state;
    const all = [
      { title: 'Daily Rescue Bonus', cat: 'Loss Relief Payments', tag: 'Daily', img: '../../../assets/x7890/promo0.png' },
      { title: 'Crown Rush 冲级闯关', cat: '冲级活动', tag: 'Event', img: '../../../assets/x7890/banner.png', href: '../../../crown-rush/Crown Rush Live.dc.html' },
      { title: 'Join Now', cat: 'Deposit Bonus', tag: 'New', img: '../../../assets/x7890/promo2.png' }
    ];
    const cats = ['All', '冲级活动', 'Loss Relief Payments', 'Deposit Bonus'];
    const list = s.tab === 'All' ? all : all.filter(p => p.cat === s.tab);
    return {
      snow: this.flakes,
      goBack: () => { if (window.history.length > 1) window.history.back(); else window.location.href = './789BingoXmasSkinLoggedIn.dc.html'; },
      tabs: cats.map(c => {
        const on = c === s.tab;
        return {
          label: c,
          bg: on ? 'linear-gradient(180deg,#2E9A58,#0F6B3A)' : 'rgba(255,248,234,.95)',
          border: on ? '#F4C658' : 'rgba(244,198,88,.55)',
          color: on ? '#FFF3D6' : '#8E0F17',
          onClick: () => this.setState({ tab: c })
        };
      }),
      promos: list.map(p => ({ ...p, onClick: () => { if (p.href) window.location.href = p.href; else this.flash('Opening ' + p.title + '…'); } })),
      isEmpty: list.length === 0,
      hasToast: !!s.toast, toast: s.toast
    };
  }
}
</script>
</body>
</html>
