<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>789Bingo · 需求与原型中心</title>
<style>
  html, body { margin:0; height:100%; background:#F6F3EE; font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:#2A1A10; }
  * { box-sizing:border-box; }
  a { color:#8E0F17; text-decoration:none; }
  a:hover { color:#B3141C; }
  .app { display:flex; height:100vh; }
  .side { flex:none; width:300px; display:flex; flex-direction:column; background:#16052F; color:#E8DCF8; }
  .brand { padding:16px 18px 12px; }
  .brand .k { font-size:11px; letter-spacing:.24em; color:#C89A3C; font-weight:700; }
  .brand .t { margin-top:4px; font-size:17px; font-weight:800; color:#FFF6E2; }
  .tabs { display:flex; gap:6px; padding:0 14px 12px; border-bottom:1px solid rgba(255,255,255,.08); }
  .tab { flex:1; text-align:center; padding:8px 0; border-radius:8px; font-size:13.5px; font-weight:800; cursor:pointer; color:#CDBBEF; background:rgba(255,255,255,.06); border:1px solid rgba(232,220,248,.14); }
  .tab:hover { background:rgba(255,255,255,.1); }
  .tab.on.cr { background:linear-gradient(135deg,#5A2BA0,#2A0A56); color:#FFF6E2; border-color:#E8C06A; }
  .tab.on.xs { background:linear-gradient(135deg,#C21F28,#6A0A12); color:#FFF6E2; border-color:#E8C06A; }
  .tools { display:flex; align-items:center; gap:6px; padding:10px 14px 4px; }
  .tools input { flex:1; min-width:0; height:30px; border-radius:7px; border:1px solid rgba(232,220,248,.2); background:rgba(255,255,255,.06); color:#FFF6E2; padding:0 10px; font-size:12.5px; outline:none; }
  .tools input::placeholder { color:#9C8BB8; }
  .mini { flex:none; padding:5px 8px; border-radius:6px; font-size:11.5px; color:#CDBBEF; border:1px solid rgba(232,220,248,.18); cursor:pointer; }
  .mini:hover { color:#FFF6E2; }
  .tree { flex:1; overflow-y:auto; padding:6px 8px 20px; }
  .row { display:flex; align-items:center; gap:7px; padding:6px 8px; border-radius:7px; cursor:pointer; font-size:13px; line-height:1.35; }
  .row:hover { background:rgba(255,255,255,.07); }
  .row.active { background:#E8C06A; color:#16052F; font-weight:700; }
  .row.active .tag { background:#16052F; color:#E8C06A; }
  .caret { flex:none; width:12px; font-size:9px; color:#9C8BB8; transition:transform .15s; }
  .caret.open { transform:rotate(90deg); }
  .grp { font-weight:700; color:#F5E6C0; }
  .grp .desc { font-size:11px; color:#9C8BB8; font-weight:400; margin-left:4px; }
  .grp .cnt { margin-left:auto; flex:none; white-space:nowrap; font-size:10.5px; color:#8E7BAE; font-weight:400; }
  .bar { flex:none; width:3px; height:14px; border-radius:2px; }
  .kids { margin-left:13px; padding-left:8px; border-left:1px dashed rgba(232,220,248,.14); }
  .tag { flex:none; padding:1px 6px; border-radius:4px; font-size:10.5px; font-weight:800; }
  .tag.doc { background:rgba(46,154,88,.25); color:#8FE3B8; }
  .tag.page { background:rgba(216,36,47,.25); color:#FFB3B3; }
  .tag.admin { background:rgba(140,110,220,.28); color:#D3C4FF; }
  .name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar { flex:none; height:46px; display:flex; align-items:center; gap:10px; padding:0 16px; background:#fff; border-bottom:1px solid #E6DED2; font-size:13px; }
  .crumb { flex:1; min-width:0; color:#7A6A58; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crumb b { color:#2A1A10; }
  .btn { flex:none; padding:5px 12px; border-radius:6px; border:1px solid #E6DED2; color:#5A3A1A; font-size:12.5px; cursor:pointer; background:#fff; }
  .btn:hover { background:#FAF6EF; }
  iframe { flex:1; width:100%; border:0; background:#fff; }
  .toggle { display:none; }
  @media (max-width: 820px) {
    .side { position:fixed; z-index:20; top:0; bottom:0; left:0; transform:translateX(-100%); transition:transform .2s; box-shadow:6px 0 20px rgba(0,0,0,.3); }
    .side.show { transform:none; }
    .toggle { display:inline-block; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="k">789BINGO</div><div class="t">需求与原型中心</div></div>
    <div class="tabs"><div class="tab cr" data-tab="cr">流水闯关</div><div class="tab xs" data-tab="xs">圣诞换肤</div></div>
    <div class="tools"><input id="q" placeholder="搜索当前需求下的页面或文档…" /><span class="mini" id="ex">全部展开</span><span class="mini" id="co">恢复默认</span></div>
    <div class="tree" id="tree"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <span class="btn toggle" id="tg">☰ 目录</span>
      <div class="crumb" id="crumb"></div>
      <a class="btn" id="home" href="#/nav.dc.html">项目导航</a>
      <a class="btn" id="newtab" target="_blank" rel="noopener">新窗口打开 ↗</a>
    </div>
    <iframe id="view" title="内容"></iframe>
  </main>
</div>
<script>
const CR = [
  ['活动预热页', 'Crown Rush Pre-Launch.dc.html', 'page'],
  ['活动进行中页', 'Crown Rush Live.dc.html', 'page'],
  ['活动结束页', 'Crown Rush Ended.dc.html', 'page'],
  ['后台管理 · 流水闯关活动', 'Crown Rush Admin.dc.html', 'admin'],
  ['后台操作手册', 'Crown Rush Admin Manual.dc.html', 'doc'],
  ['需求速览', 'Crown Rush PRD Overview.dc.html', 'doc'],
  ['开发需求 PRD', 'Crown Rush PRD.dc.html', 'doc'],
  ['开发自查清单', 'Crown Rush Dev Checklist.dc.html', 'doc']
];
const noPages = l => l.filter(x => x[2] !== 'page');
const files = (dir, list) => list.map(([name, f, t]) => ({ name, path: dir + '/' + f, type: t }));
const iters = (root, k) => [
  { key: k + '-full', name: '完整需求', desc: '全部功能', children: files(root + '/full', CR) },
  { key: k + '-10', name: 'v1.0 迭代', desc: '前台全量 + 后台精简', children: files(root + '/v1.0', CR) },
  { key: k + '-11', name: 'v1.1 迭代', desc: '仅后台', children: files(root + '/v1.1', noPages(CR)) },
  { key: k + '-12', name: 'v1.2 迭代', desc: '仅后台 · 完整', children: files(root + '/v1.2', noPages(CR)) }
];
const SKIN = [
  ['首页 · 未登录', '789BingoXmasSkin.dc.html', 'page'], ['首页 · 已登录', '789BingoXmasSkinLoggedIn.dc.html', 'page'],
  ['登录页', '789BingoMaxSkinLogin.dc.html', 'page'], ['Promotions', '789BingoXmasPromotions.dc.html', 'page'],
  ['钱包', '789BingoXmasWallet.dc.html', 'page'], ['个人中心', '789BingoXmasAccount.dc.html', 'page'],
  ['等级中心', '789BingoXmasLevel.dc.html', 'page'], ['聊天室', '789BingoXmasChat.dc.html', 'page'],
  ['邀请', '789BingoXmasInvite.dc.html', 'page'], ['游戏查询', '789BingoXmasSearch.dc.html', 'page'],
  ['后台 · 节日皮肤管理', 'Skin Admin.dc.html', 'admin'], ['后台操作手册', 'Skin Admin Manual.dc.html', 'doc'],
  ['换肤需求 PRD', '789BingoSkinPRD.dc.html', 'doc']
];
const skinGroups = (dir, k, noAdmin) => [
  { key: k + '-pages', name: '页面原型', children: files(dir, SKIN.filter(x => x[2] === 'page')) },
  { key: k + '-doc', name: '后台与文档', children: files(dir, SKIN.filter(x => x[2] !== 'page' && (!noAdmin || x[1].indexOf('Skin Admin') !== 0))) }
];
const TREES = {
  cr: [
    { key: 'cr-plan', name: '版本规划', desc: 'plan', color: '#0F6B3A', children: [
      { key: 'cr-plan-latest', name: '最新需求记录', desc: 'latest', children: [
        { key: 'cr-pl-v11', name: 'v1.1', desc: '当前规划', children: iters('crown-rush/plan/latest/v1.1', 'cr-pl') }
      ] },
      { key: 'cr-plan-history', name: '历史需求记录', desc: 'history', color: '#8A817B', children: [
        { key: 'cr-ph-v10', name: 'v1.0', desc: '已归档', children: iters('crown-rush/plan/history/v1.0', 'cr-ph') }
      ] }
    ] }
  ],
  xs: [
    { key: 'xs-latest', name: '最新需求记录', desc: 'latest', color: '#0F6B3A', children: [
      { key: 'xs-11', name: 'v1.1', desc: '当前版本', children: skinGroups('xmas-skin/latest/v1.1', 'xs-11', true) }
    ] },
    { key: 'xs-his', name: '历史需求记录', desc: 'history', color: '#8A817B', children: [
      { key: 'xs-10', name: 'v1.0', desc: '已定稿', children: skinGroups('xmas-skin/history/v1.0', 'xs-10', false) }
    ] }
  ]
};
const DEFAULT_OPEN = { 'cr-plan': true, 'cr-plan-latest': true, 'cr-pl-v11': true, 'cr-pl-10': true, 'xs-latest': true, 'xs-11': true, 'xs-11-pages': true, 'xs-11-doc': true };
const TITLE = { cr: '流水闯关活动', xs: '圣诞换肤' };
const TAG = { doc: '文档', page: '页面', admin: '后台' };
const byPath = {}, trail = {};
Object.keys(TREES).forEach(tab => (function idx(nodes, tr) { nodes.forEach(n => { const t2 = tr.concat([n]); if (n.path) { byPath[n.path] = { node: n, tab }; trail[n.path] = t2; } if (n.children) idx(n.children, t2); }); })(TREES[tab], []));
let open = Object.assign({}, DEFAULT_OPEN), tab = 'cr', current = '', query = '';
const $ = id => document.getElementById(id);
const count = n => n.path ? 1 : (n.children || []).reduce((a, c) => a + count(c), 0);
const match = n => !query || (n.path ? (n.name + ' ' + n.path).toLowerCase().includes(query) : (n.children || []).some(match));
function render() {
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('on', el.dataset.tab === tab));
  const host = $('tree'); host.innerHTML = '';
  const build = (nodes, el, color) => nodes.forEach(n => {
    if (!match(n)) return;
    const row = document.createElement('div'); row.className = 'row' + (n.path && n.path === current ? ' active' : '');
    if (n.children) {
      const isOpen = query ? true : !!open[n.key]; const c = n.color || color || '#D9CDB8';
      row.classList.add('grp');
      row.innerHTML = '<span class="caret' + (isOpen ? ' open' : '') + '">▶</span><span class="bar" style="background:' + c + '"></span><span class="name">' + n.name + (n.desc ? '<span class="desc">' + n.desc + '</span>' : '') + '</span><span class="cnt">' + count(n) + ' 项</span>';
      row.onclick = () => { open[n.key] = !open[n.key]; render(); };
      el.appendChild(row);
      if (isOpen) { const kids = document.createElement('div'); kids.className = 'kids'; build(n.children, kids, c); el.appendChild(kids); }
    } else {
      row.innerHTML = '<span class="tag ' + n.type + '">' + TAG[n.type] + '</span><span class="name">' + n.name + '</span>';
      row.title = n.path; row.onclick = () => { go(n.path); $('side').classList.remove('show'); };
      el.appendChild(row);
    }
  });
  build(TREES[tab], host);
}
function crumbOf(p) {
  const t = trail[p]; if (!t) return '<b>' + (p === 'nav.dc.html' ? '项目导航' : decodeURIComponent(p)) + '</b>';
  return TITLE[byPath[p].tab] + ' › ' + t.map((n, i) => i === t.length - 1 ? '<b>' + n.name + '</b>' : n.name).join(' › ');
}
function go(path, fromFrame) {
  const clean = path.split('#')[0]; current = clean;
  if (byPath[clean]) { tab = byPath[clean].tab; (trail[clean] || []).forEach(n => { if (n.key) open[n.key] = true; }); }
  if (!fromFrame) $('view').src = encodeURI(path);
  $('crumb').innerHTML = crumbOf(clean); $('newtab').href = encodeURI(path);
  const h = '#/' + path; if (location.hash !== h) history.replaceState(null, '', h);
  document.title = (byPath[clean] ? byPath[clean].node.name + ' · ' : '') + '789Bingo 需求与原型中心';
  render();
}
$('view').addEventListener('load', () => {
  try {
    const base = location.href.replace(/[#?].*$/, '').replace(/[^/]*$/, '');
    const rel = decodeURIComponent($('view').contentWindow.location.href.replace(base, '').replace(/[?].*$/, ''));
    if (rel && rel.split('#')[0] !== current) go(rel, true);
  } catch (e) {}
});
document.querySelectorAll('.tab').forEach(el => el.onclick = () => { tab = el.dataset.tab; query = ''; $('q').value = ''; render(); });
$('q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); render(); });
$('ex').onclick = () => { (function all(ns) { ns.forEach(n => { if (n.children) { open[n.key] = true; all(n.children); } }); })(TREES[tab]); render(); };
$('co').onclick = () => { open = Object.assign({}, DEFAULT_OPEN); render(); };
$('tg').onclick = () => $('side').classList.toggle('show');
window.addEventListener('hashchange', () => { const p = decodeURIComponent(location.hash.replace(/^#\//, '')); if (p && p.split('#')[0] !== current) go(p); });
go(decodeURIComponent(location.hash.replace(/^#\//, '')) || 'nav.dc.html');
</script>
</body>
</html>
